# Install in /etc/nginx/conf.d/ (http context).
limit_req_zone $binary_remote_addr zone=ergou_console_ip:1m rate=6r/s;

# Match the normalized path that proxy_pass will forward. Only the console
# assets and namespace are published; the node bridge uses a separate path.
map $uri $ergou_public_allowed {
    default                         0;
    /ergou/                         1;
    /ergou/app.js                   1;
    /ergou/style.css                1;
    /ergou/rules.js                 1;
    /ergou/group-tools.js           1;
    /ergou/member-notices.js        1;
    /ergou/voice.js                 1;
    /ergou/accounts.js              1;
    /ergou/wechat-login.js          1;
    /ergou/voice-sample.wav         1;
    ~^/ergou/api/[a-z0-9-]+(?:/[a-z0-9-]+)*$ 1;
}
