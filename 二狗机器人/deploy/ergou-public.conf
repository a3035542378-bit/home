# Include only in the existing HTTPS server block.
location = /ergou {
    absolute_redirect off;
    return 308 /ergou/;
}

location ^~ /ergou/ {
    if ($ergou_public_allowed = 0) { return 404; }
    satisfy all;
    auth_basic "Ergou operations";
    auth_basic_user_file /etc/nginx/ergou-public.htpasswd;

    limit_req zone=ergou_console_ip burst=24 nodelay;
    limit_req_status 429;
    client_max_body_size 3m;
    access_log off;

    proxy_pass http://127.0.0.1:8766/;
    proxy_set_header Authorization "";
    proxy_set_header Proxy-Authorization "";
    proxy_set_header Cookie "ergou_cloud_session=$cookie_ergou_cloud_session";
    proxy_cookie_path / /ergou/;
    proxy_cookie_flags ergou_cloud_session secure httponly samesite=strict;
}
